<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="title desc">
<title id="title">Three-loop WinPE deployment workflow</title><desc id="desc">Loop A builds the USB, Loop B refreshes the image, and Loop C deploys each machine.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".32"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker></defs>
<rect width="1400" height="860" rx="32" fill="url(#bg)"/><circle cx="1280" cy="110" r="160" fill="#60a5fa" opacity=".16"/><circle cx="120" cy="760" r="190" fill="#34d399" opacity=".15"/>
<text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">Three Loops, One Deployment System</text>
<text x="72" y="130" font-family="Segoe UI,Arial" font-size="22" fill="#bfdbfe">Rebuild only the layer that changed: boot media, Windows image, or the target machine.</text>
<g font-family="Segoe UI,Arial" fill="#e5e7eb">
<g transform="translate(90 230)"><rect width="350" height="430" rx="30" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="72" cy="76" r="42" fill="#2563eb"/><text x="72" y="91" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">A</text><text x="132" y="62" font-size="26" font-weight="800" fill="#f8fafc">One-time setup</text><text x="132" y="96" font-size="18" font-weight="600" fill="#93c5fd">Admin Windows + ADK</text><text x="34" y="175" font-size="24">Install ADK</text><text x="34" y="207" font-size="24">Partition USB</text><text x="34" y="239" font-size="24">Build boot.wim</text><rect x="34" y="330" width="170" height="44" rx="22" fill="#172554" stroke="#60a5fa"/><text x="119" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#dbeafe">~30 min</text></g>
<g transform="translate(510 230)"><rect width="350" height="430" rx="30" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="72" cy="76" r="42" fill="#0f766e"/><text x="72" y="91" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">B</text><text x="132" y="62" font-size="26" font-weight="800" fill="#f8fafc">Per-image refresh</text><text x="132" y="96" font-size="18" font-weight="600" fill="#93c5fd">Admin Windows</text><text x="34" y="175" font-size="24">Debloat ISO</text><text x="34" y="207" font-size="24">Inject drivers</text><text x="34" y="239" font-size="24">Write WIM to IMAGES</text><rect x="34" y="330" width="170" height="44" rx="22" fill="#064e3b" stroke="#34d399"/><text x="119" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#dcfce7">10–20 min</text></g>
<g transform="translate(930 230)"><rect width="350" height="430" rx="30" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="72" cy="76" r="42" fill="#f97316"/><text x="72" y="91" text-anchor="middle" font-size="40" font-weight="900" fill="#fff">C</text><text x="132" y="62" font-size="26" font-weight="800" fill="#f8fafc">Per-machine deploy</text><text x="132" y="96" font-size="18" font-weight="600" fill="#93c5fd">WinPE on target</text><text x="34" y="175" font-size="24">Boot USB</text><text x="34" y="207" font-size="24">Select image + disk</text><text x="34" y="239" font-size="24">Apply Windows</text><rect x="34" y="330" width="170" height="44" rx="22" fill="#7c2d12" stroke="#fb923c"/><text x="119" y="359" text-anchor="middle" font-size="18" font-weight="700" fill="#ffedd5">5–10 min</text></g>
</g>
<line x1="450" y1="445" x2="500" y2="445" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/><line x1="870" y1="445" x2="920" y2="445" stroke="#93c5fd" stroke-width="5" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="120" y="720" width="1160" height="72" rx="22" fill="#111827" stroke="#334155"/><text x="700" y="766" text-anchor="middle" font-family="Segoe UI,Arial" font-size="24" font-weight="700" fill="#e5e7eb">A builds the boot environment • B refreshes Windows images • C deploys machines</text>
</svg>
