<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc"><title id="title">WinPE runtime data flow</title><desc id="desc">Boot from USB, find image, run preflight, select disk, apply Windows, and first boot.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker></defs><rect width="1600" height="980" rx="32" fill="url(#bg)"/><circle cx="1460" cy="100" r="170" fill="#60a5fa" opacity=".15"/><circle cx="110" cy="880" r="200" fill="#34d399" opacity=".13"/><text x="70" y="88" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">Runtime Data Flow</text><text x="72" y="128" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">Each stage verifies the environment, image, disk, and applied Windows files before moving forward.</text><g font-family="Segoe UI,Arial" fill="#e5e7eb"><g transform="translate(90 230)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#2563eb"/><rect y="30" width="250" height="28" fill="#2563eb"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">USB Boot</text><text x="28" y="105" font-size="20" font-weight="600">FAT32 WinPE</text><text x="28" y="133" font-size="20" font-weight="600">startnet.cmd</text><text x="28" y="161" font-size="20" font-weight="600">wpeinit</text></g><g transform="translate(420 230)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#0f766e"/><rect y="30" width="250" height="28" fill="#0f766e"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Image Source</text><text x="28" y="105" font-size="20" font-weight="600">Find IMAGES label</text><text x="28" y="133" font-size="20" font-weight="600">or scan drives</text><text x="28" y="161" font-size="20" font-weight="600">load WIM/ESD</text></g><g transform="translate(750 230)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#f97316"/><rect y="30" width="250" height="28" fill="#f97316"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Preflight</text><text x="28" y="105" font-size="20" font-weight="600">Admin check</text><text x="28" y="133" font-size="20" font-weight="600">WinPE warning</text><text x="28" y="161" font-size="20" font-weight="600">silent contract</text></g><g transform="translate(1080 230)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#f97316"/><rect y="30" width="250" height="28" fill="#f97316"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Disk Safety</text><text x="28" y="105" font-size="20" font-weight="600">exclude USB</text><text x="28" y="133" font-size="20" font-weight="600">select target</text><text x="28" y="161" font-size="20" font-weight="600">typed ERASE</text></g><g transform="translate(255 600)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#2563eb"/><rect y="30" width="250" height="28" fill="#2563eb"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Apply Windows</text><text x="28" y="105" font-size="20" font-weight="600">diskpart GPT</text><text x="28" y="133" font-size="20" font-weight="600">DISM apply</text><text x="28" y="161" font-size="20" font-weight="600">bcdboot UEFI</text></g><g transform="translate(615 600)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#0f766e"/><rect y="30" width="250" height="28" fill="#0f766e"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">First Boot</text><text x="28" y="105" font-size="20" font-weight="600">unattend.xml</text><text x="28" y="133" font-size="20" font-weight="600">SetupComplete</text><text x="28" y="161" font-size="20" font-weight="600">BitLocker optional</text></g><g transform="translate(975 600)"><rect width="250" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="250" height="58" rx="28" fill="#2563eb"/><rect y="30" width="250" height="28" fill="#2563eb"/><text x="125" y="39" text-anchor="middle" font-size="23" font-weight="800" fill="#fff">Done</text><text x="28" y="105" font-size="20" font-weight="600">remove USB</text><text x="28" y="133" font-size="20" font-weight="600">Windows setup</text><text x="28" y="161" font-size="20" font-weight="600">ready for handoff</text></g></g><g stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"><line x1="340" y1="325" x2="415" y2="325"/><line x1="670" y1="325" x2="745" y2="325"/><line x1="1000" y1="325" x2="1075" y2="325"/><line x1="1205" y1="420" x2="380" y2="595"/><line x1="505" y1="695" x2="610" y2="695"/><line x1="865" y1="695" x2="970" y2="695"/></g><rect x="120" y="855" width="1360" height="70" rx="22" fill="#111827" stroke="#334155"/><text x="800" y="900" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#e5e7eb">Fail loud and early: no disk writes before preflight, target selection, and typed destructive confirmation pass.</text></svg>