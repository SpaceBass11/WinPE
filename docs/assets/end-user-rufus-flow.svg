<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="800" viewBox="0 0 1500 800" role="img" aria-labelledby="title desc"><title id="title">End-user ISO to Rufus to USB deployment flow</title><desc id="desc">Six-step user flow for flashing a deployment ISO with Rufus and booting from USB.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker></defs><rect width="1500" height="800" rx="32" fill="url(#bg)"/><circle cx="1370" cy="100" r="160" fill="#60a5fa" opacity=".15"/><circle cx="110" cy="720" r="185" fill="#34d399" opacity=".13"/><text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">End-User ISO Path</text><text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">For non-IT users: one ISO, Rufus, one USB, boot menu, then let the deployment run.</text><g font-family="Segoe UI,Arial" fill="#e5e7eb"><g transform="translate(80 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#2563eb"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">1</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Download ISO</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">provided by IT</text></g><g transform="translate(315 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#0f766e"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">2</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Open Rufus</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">select USB + ISO</text></g><g transform="translate(550 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#f97316"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">3</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Flash USB</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">all USB data erased</text></g><g transform="translate(785 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#2563eb"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">4</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Boot target</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">F12 / F9 / Esc</text></g><g transform="translate(1020 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#0f766e"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">5</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Let it run</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">do not unplug</text></g><g transform="translate(1255 285)"><rect width="190" height="230" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><circle cx="95" cy="70" r="42" fill="#2563eb"/><text x="95" y="85" text-anchor="middle" font-size="38" font-weight="900" fill="#fff">6</text><text x="95" y="145" text-anchor="middle" font-size="22" font-weight="800" fill="#f8fafc">Windows setup</text><text x="95" y="185" text-anchor="middle" font-size="17" font-weight="600">remove USB when told</text></g></g><g stroke="#93c5fd" stroke-width="3" stroke-linecap="round" marker-end="url(#a)"><line x1="275" y1="400" x2="308" y2="400"/><line x1="510" y1="400" x2="543" y2="400"/><line x1="745" y1="400" x2="778" y2="400"/><line x1="980" y1="400" x2="1013" y2="400"/><line x1="1215" y1="400" x2="1248" y2="400"/></g><rect x="215" y="610" width="1070" height="76" rx="22" fill="#111827" stroke="#334155"/><text x="750" y="657" text-anchor="middle" font-family="Segoe UI,Arial" font-size="22" font-weight="700" fill="#e5e7eb">Simple user message: flash the ISO, boot from USB, and follow the on-screen prompts.</text></svg>