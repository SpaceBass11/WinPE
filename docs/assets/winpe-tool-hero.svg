<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
  <title id="title">WinPE Image Deployment Tool overview</title>
  <desc id="desc">Hero image showing a WinPE deployment terminal and major capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#07101f"/><stop offset="45%" stop-color="#102344"/><stop offset="100%" stop-color="#101827"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#34d399"/><stop offset="100%" stop-color="#0f766e"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#fbbf24"/><stop offset="100%" stop-color="#f97316"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.32"/></filter>
  </defs>
  <rect width="1400" height="780" rx="32" fill="url(#bg)"/>
  <circle cx="1290" cy="90" r="150" fill="#60a5fa" opacity="0.18"/>
  <circle cx="90" cy="700" r="180" fill="#34d399" opacity="0.18"/>
  <text x="70" y="90" font-family="Segoe UI,Arial,sans-serif" font-size="46" font-weight="800" fill="#f8fafc">WinPE Image Deployment Tool</text>
  <text x="72" y="132" font-family="Segoe UI,Arial,sans-serif" font-size="22" fill="#bfdbfe">Bootable USB deployment for Windows images — built for air-gapped, enterprise, bare-metal workflows.</text>
  <rect x="70" y="210" width="760" height="460" rx="18" fill="#020617" stroke="#334155" filter="url(#shadow)"/>
  <rect x="70" y="210" width="760" height="46" rx="18" fill="#111827"/>
  <rect x="70" y="238" width="760" height="18" fill="#111827"/>
  <circle cx="94" cy="233" r="7" fill="#ef4444"/><circle cx="118" cy="233" r="7" fill="#f59e0b"/><circle cx="142" cy="233" r="7" fill="#22c55e"/>
  <text x="156" y="240" font-family="Consolas,Cascadia Mono,monospace" font-size="16" font-weight="600" fill="#94a3b8">X:\scripts\unified_winpe_deploy.ps1</text>
  <g font-family="Consolas,Cascadia Mono,monospace" font-size="18">
    <text x="98" y="288" font-weight="700" fill="#93c5fd">&gt; WinPE Deploy Tool v4.7.1</text>
    <text x="98" y="316" fill="#e5e7eb">[1] Discover images from IMAGES partition</text>
    <text x="98" y="344" fill="#e5e7eb">[2] Select WIM/ESD + edition</text>
    <text x="98" y="372" font-weight="700" fill="#fbbf24">[3] Confirm target disk: ERASE</text>
    <text x="98" y="400" fill="#e5e7eb">[4] Apply image with DISM /CheckIntegrity</text>
    <text x="98" y="428" fill="#e5e7eb">[5] Stage unattend.xml + BitLocker setup</text>
    <text x="98" y="456" font-weight="700" fill="#34d399">[DONE] Reboot into Windows first boot</text>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="800" fill="#fff">
    <rect x="900" y="220" width="190" height="135" rx="24" fill="url(#blue)"/><text x="924" y="278">One USB,</text><text x="924" y="308">many images</text>
    <rect x="1130" y="220" width="190" height="135" rx="24" fill="url(#orange)"/><text x="1154" y="278">Typed</text><text x="1154" y="308">destructive</text><text x="1154" y="338">confirmations</text>
    <rect x="900" y="410" width="190" height="135" rx="24" fill="url(#green)"/><text x="924" y="468">Dell BIOS</text><text x="924" y="498">pre-apply</text>
    <rect x="1130" y="410" width="190" height="135" rx="24" fill="url(#blue)"/><text x="1154" y="468">BitLocker</text><text x="1154" y="498">first boot</text>
  </g>
  <rect x="890" y="620" width="390" height="52" rx="26" fill="#0f172a" stroke="#60a5fa"/>
  <text x="1085" y="653" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#dbeafe" text-anchor="middle">Admin Windows → USB → WinPE → Windows</text>
</svg>
