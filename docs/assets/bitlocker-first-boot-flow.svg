<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">BitLocker first-boot flow and recovery-key escrow paths</title><desc id="desc">SetupComplete runs bitlocker-setup, enables BitLocker, escrows keys, and reboots.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0 10 5 0 10z" fill="#93c5fd"/></marker></defs><rect width="1500" height="900" rx="32" fill="url(#bg)"/><circle cx="1370" cy="105" r="165" fill="#60a5fa" opacity=".15"/><circle cx="115" cy="815" r="190" fill="#34d399" opacity=".13"/><text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">BitLocker First-Boot Flow</text><text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">BitLocker is staged in WinPE, then enabled by Windows Setup on first boot.</text><g font-family="Segoe UI,Arial"><g transform="translate(90 245)"><rect width="260" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="260" height="58" rx="28" fill="#2563eb"/><rect y="30" width="260" height="28" fill="#2563eb"/><text x="130" y="39" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">WinPE deploy</text><text x="30" y="105" font-size="20" font-weight="600" fill="#e5e7eb">copy scripts into</text><text x="30" y="133" font-size="20" font-weight="600" fill="#e5e7eb">C:\Windows\Setup\Scripts</text></g><g transform="translate(410 245)"><rect width="260" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="260" height="58" rx="28" fill="#0f766e"/><rect y="30" width="260" height="28" fill="#0f766e"/><text x="130" y="39" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">SetupComplete.cmd</text><text x="30" y="105" font-size="20" font-weight="600" fill="#e5e7eb">runs once as SYSTEM</text><text x="30" y="133" font-size="20" font-weight="600" fill="#e5e7eb">after OOBE</text></g><g transform="translate(730 245)"><rect width="260" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="260" height="58" rx="28" fill="#f97316"/><rect y="30" width="260" height="28" fill="#f97316"/><text x="130" y="39" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">bitlocker-setup.ps1</text><text x="30" y="105" font-size="20" font-weight="600" fill="#e5e7eb">TPM+PIN on C:</text><text x="30" y="133" font-size="20" font-weight="600" fill="#e5e7eb">optional D: auto-unlock</text></g><g transform="translate(1050 245)"><rect width="260" height="190" rx="28" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect width="260" height="58" rx="28" fill="#0f766e"/><rect y="30" width="260" height="28" fill="#0f766e"/><text x="130" y="39" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">Escrow keys</text><text x="30" y="105" font-size="20" font-weight="600" fill="#e5e7eb">UNC path, IMAGES USB,</text><text x="30" y="133" font-size="20" font-weight="600" fill="#e5e7eb">or fallback warning</text></g></g><g stroke="#93c5fd" stroke-width="4" stroke-linecap="round" marker-end="url(#a)"><line x1="350" y1="340" x2="405" y2="340"/><line x1="670" y1="340" x2="725" y2="340"/><line x1="990" y1="340" x2="1045" y2="340"/></g><rect x="155" y="575" width="1190" height="210" rx="28" fill="#111827" stroke="#334155"/><text x="750" y="620" text-anchor="middle" font-family="Segoe UI,Arial" font-size="26" font-weight="800" fill="#f8fafc">Recovery-key escrow priority</text><g font-family="Segoe UI,Arial"><circle cx="240" cy="690" r="31" fill="#2563eb"/><text x="240" y="700" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">1</text><text x="295" y="678" font-size="20" font-weight="800" fill="#e5e7eb">-BitLockerKeyPath</text><text x="295" y="705" font-size="16" fill="#cbd5e1">central UNC/fixed path; USB can be removed</text><circle cx="585" cy="690" r="31" fill="#2563eb"/><text x="585" y="700" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">2</text><text x="640" y="678" font-size="20" font-weight="800" fill="#e5e7eb">IMAGES label</text><text x="640" y="705" font-size="16" fill="#cbd5e1">default USB escrow; keep USB through first reboot</text><circle cx="965" cy="690" r="31" fill="#ef4444"/><text x="965" y="700" text-anchor="middle" font-size="26" font-weight="900" fill="#fff">3</text><text x="1020" y="678" font-size="20" font-weight="800" fill="#e5e7eb">C:\Windows\Setup\BitLockerKeys</text><text x="1020" y="705" font-size="16" fill="#cbd5e1">fallback only; key is on protected volume</text></g></svg>