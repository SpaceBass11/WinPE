<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc">
<title id="title">Dual-partition WinPE USB layout</title><desc id="desc">A small WinPE FAT32 boot partition and a larger NTFS IMAGES partition.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".32"/></filter></defs>
<rect width="1400" height="780" rx="32" fill="url(#bg)"/><circle cx="1290" cy="100" r="160" fill="#60a5fa" opacity=".16"/><circle cx="90" cy="705" r="180" fill="#34d399" opacity=".15"/>
<text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">USB Layout</text>
<text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">FAT32 boots WinPE. NTFS carries WIMs, configs, deploy.args, CCTK files, and BitLocker escrow.</text>
<rect x="100" y="230" width="1200" height="170" rx="40" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#s)"/>
<rect x="130" y="270" width="1100" height="90" rx="22" fill="#111827" stroke="#64748b" stroke-width="2"/><rect x="1230" y="292" width="70" height="46" rx="8" fill="#475569"/><rect x="100" y="295" width="36" height="40" rx="6" fill="#334155"/>
<rect x="160" y="279" width="230" height="72" rx="16" fill="#2563eb"/><rect x="400" y="279" width="805" height="72" rx="16" fill="#0f766e"/>
<text x="275" y="324" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="800" fill="#fff">WinPE  FAT32  ~2 GB</text><text x="802" y="324" text-anchor="middle" font-family="Segoe UI,Arial" font-size="20" font-weight="800" fill="#fff">IMAGES  NTFS  remaining space</text>
<rect x="140" y="455" width="1120" height="240" rx="18" fill="#020617" stroke="#334155" filter="url(#s)"/><rect x="140" y="455" width="1120" height="46" rx="18" fill="#111827"/><rect x="140" y="483" width="1120" height="18" fill="#111827"/><circle cx="164" cy="478" r="7" fill="#ef4444"/><circle cx="188" cy="478" r="7" fill="#f59e0b"/><circle cx="212" cy="478" r="7" fill="#22c55e"/>
<text x="226" y="485" font-family="Consolas,Cascadia Mono,monospace" font-size="16" font-weight="600" fill="#94a3b8">I:\  (IMAGES partition)</text>
<g font-family="Consolas,Cascadia Mono,monospace" font-size="18">
<text x="168" y="533" font-weight="700" fill="#fbbf24">I:\deploy.args                         optional one-line automation file</text>
<text x="168" y="561" fill="#e5e7eb">I:\images\Win11_Enterprise.wim         WIM/ESD payloads</text>
<text x="168" y="589" fill="#e5e7eb">I:\configs\unattend.xml                first-boot setup</text>
<text x="168" y="617" fill="#e5e7eb">I:\cctk\default.ini                    Dell BIOS config, optional</text>
<text x="168" y="645" font-weight="700" fill="#34d399">I:\BitLockerKeys\&lt;hostname&gt;\           recovery key escrow</text>
</g></svg>
