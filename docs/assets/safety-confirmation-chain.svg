<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-labelledby="title desc"><title id="title">Typed confirmation safety chain</title><desc id="desc">Shows DESTROY SYSTEM, ERASE, WIPE ALL, and WIPE DATA guardrails.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter></defs><rect width="1500" height="850" rx="32" fill="url(#bg)"/><circle cx="1370" cy="100" r="160" fill="#60a5fa" opacity=".15"/><circle cx="100" cy="770" r="190" fill="#34d399" opacity=".13"/><text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">Safety Guardrails</text><text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">Destructive operations require exact typed phrases. Automation never bypasses the live-system protection gate.</text><g font-family="Segoe UI,Arial"><g transform="translate(120 230)"><rect width="1260" height="100" rx="24" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect x="30" y="22" width="250" height="56" rx="16" fill="#ef4444"/><text x="155" y="60" text-anchor="middle" font-family="Consolas,Cascadia Mono,monospace" font-size="24" font-weight="900" fill="#fff">DESTROY SYSTEM</text><text x="330" y="52" font-size="22" font-weight="700" fill="#f8fafc">Selected disk is the live system disk</text><text x="330" y="78" font-size="18" font-weight="600" fill="#fecaca">Never bypassed</text></g><g transform="translate(120 348)"><rect width="1260" height="100" rx="24" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect x="30" y="22" width="250" height="56" rx="16" fill="#f97316"/><text x="155" y="60" text-anchor="middle" font-family="Consolas,Cascadia Mono,monospace" font-size="24" font-weight="900" fill="#fff">ERASE</text><text x="330" y="52" font-size="22" font-weight="700" fill="#f8fafc">Primary target disk wipe</text><text x="330" y="78" font-size="18" font-weight="600" fill="#cbd5e1">Bypassable with -Force</text></g><g transform="translate(120 466)"><rect width="1260" height="100" rx="24" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect x="30" y="22" width="250" height="56" rx="16" fill="#f59e0b"/><text x="155" y="60" text-anchor="middle" font-family="Consolas,Cascadia Mono,monospace" font-size="24" font-weight="900" fill="#fff">WIPE ALL</text><text x="330" y="52" font-size="22" font-weight="700" fill="#f8fafc">Additional wipe disks</text><text x="330" y="78" font-size="18" font-weight="600" fill="#cbd5e1">Bypassable with -Force</text></g><g transform="translate(120 584)"><rect width="1260" height="100" rx="24" fill="#0f172a" stroke="#334155" filter="url(#s)"/><rect x="30" y="22" width="250" height="56" rx="16" fill="#f59e0b"/><text x="155" y="60" text-anchor="middle" font-family="Consolas,Cascadia Mono,monospace" font-size="24" font-weight="900" fill="#fff">WIPE DATA</text><text x="330" y="52" font-size="22" font-weight="700" fill="#f8fafc">Optional data disk format</text><text x="330" y="78" font-size="18" font-weight="600" fill="#cbd5e1">Bypassable with -Force</text></g></g><rect x="310" y="725" width="880" height="70" rx="18" fill="#020617" stroke="#334155"/><text x="750" y="770" text-anchor="middle" font-family="Consolas,Cascadia Mono,monospace" font-size="22" font-weight="800" fill="#fbbf24">Type ERASE to wipe Disk 0 and deploy: _</text></svg>