<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc"><title id="title">WinPE TUI mockup</title><desc id="desc">Synthetic mockup of the WinPE console menu showing image selection and disk confirmation.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".32"/></filter></defs><rect width="1500" height="900" rx="32" fill="url(#bg)"/><circle cx="1365" cy="105" r="165" fill="#60a5fa" opacity=".15"/><circle cx="110" cy="820" r="190" fill="#34d399" opacity=".13"/><text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">WinPE TUI Preview</text><text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">Operator workflow: choose image, verify disk, type confirmation, then apply.</text><rect x="165" y="210" width="1170" height="605" rx="18" fill="#020617" stroke="#334155" filter="url(#s)"/><rect x="165" y="210" width="1170" height="46" rx="18" fill="#111827"/><rect x="165" y="238" width="1170" height="18" fill="#111827"/><circle cx="189" cy="233" r="7" fill="#ef4444"/><circle cx="213" cy="233" r="7" fill="#f59e0b"/><circle cx="237" cy="233" r="7" fill="#22c55e"/><text x="251" y="240" font-family="Consolas,Cascadia Mono,monospace" font-size="16" font-weight="600" fill="#94a3b8">X:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe</text><g font-family="Consolas,Cascadia Mono,monospace" font-size="18"><text x="193" y="288" font-weight="700" fill="#38bdf8">============================================================</text><text x="193" y="316" font-weight="700" fill="#38bdf8">  WinPE Image Deployment Tool</text><text x="193" y="344" font-weight="700" fill="#38bdf8">============================================================</text><text x="193" y="400" font-weight="700" fill="#34d399">Found image drive: I:  label=IMAGES</text><text x="193" y="456" font-weight="700" fill="#e5e7eb">Available Windows images:</text><text x="193" y="484" fill="#e5e7eb">  [1] I:\images\Win11_Enterprise_24H2.wim</text><text x="193" y="512" fill="#e5e7eb">  [2] I:\images\Win10_Enterprise_LTSC.wim</text><text x="193" y="568" font-weight="700" fill="#e5e7eb">Target disks:</text><text x="193" y="596" font-weight="700" fill="#fbbf24">  [0] Samsung NVMe 1TB     WILL BE ERASED</text><text x="193" y="624" fill="#e5e7eb">  [1] Internal SSD 2TB      data disk optional</text><text x="193" y="700" font-weight="800" fill="#f97316">Type ERASE to wipe Disk 0 and deploy: _</text></g><rect x="345" y="840" width="810" height="38" rx="18" fill="#172554" stroke="#60a5fa"/><text x="750" y="866" text-anchor="middle" font-family="Segoe UI,Arial" font-size="17" font-weight="700" fill="#dbeafe">Mockup SVG — not a captured production screen</text></svg>