<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc"><title id="title">Target disk GPT UEFI partition layout</title><desc id="desc">The deploy script creates EFI, MSR, and Windows partitions on the target disk.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset=".55" stop-color="#102344"/><stop offset="1" stop-color="#101827"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-opacity=".32"/></filter></defs><rect width="1400" height="720" rx="32" fill="url(#bg)"/><circle cx="1290" cy="100" r="160" fill="#60a5fa" opacity=".16"/><circle cx="100" cy="650" r="180" fill="#34d399" opacity=".15"/><text x="70" y="90" font-family="Segoe UI,Arial" font-size="42" font-weight="800" fill="#f8fafc">Target Disk Layout</text><text x="72" y="130" font-family="Segoe UI,Arial" font-size="21" fill="#bfdbfe">Standard UEFI/GPT layout created during deployment.</text><rect x="100" y="250" width="1200" height="150" rx="34" fill="#0f172a" stroke="#475569" stroke-width="2" filter="url(#s)"/><rect x="140" y="300" width="180" height="70" rx="14" fill="#2563eb" stroke="#0f172a" stroke-width="4"/><rect x="320" y="300" width="80" height="70" rx="14" fill="#64748b" stroke="#0f172a" stroke-width="4"/><rect x="400" y="300" width="860" height="70" rx="14" fill="#0f766e" stroke="#0f172a" stroke-width="4"/><g font-family="Segoe UI,Arial" font-weight="900" font-size="24" fill="#fff" text-anchor="middle"><text x="230" y="344">EFI</text><text x="360" y="344">MSR</text><text x="830" y="344">Windows</text></g><g font-family="Segoe UI,Arial" text-anchor="middle"><rect x="140" y="415" width="180" height="150" rx="18" fill="#111827" stroke="#334155"/><text x="230" y="455" font-size="20" font-weight="800" fill="#e5e7eb">300 MB</text><text x="230" y="490" font-size="17" font-weight="600" fill="#93c5fd">FAT32</text><text x="230" y="524" font-size="17" font-weight="600" fill="#cbd5e1">Drive: S:</text><rect x="320" y="415" width="80" height="150" rx="18" fill="#111827" stroke="#334155"/><text x="360" y="455" font-size="20" font-weight="800" fill="#e5e7eb">16 MB</text><text x="360" y="490" font-size="17" font-weight="600" fill="#93c5fd">Reserved</text><text x="360" y="524" font-size="17" font-weight="600" fill="#cbd5e1">—</text><rect x="400" y="415" width="860" height="150" rx="18" fill="#111827" stroke="#334155"/><text x="830" y="455" font-size="20" font-weight="800" fill="#e5e7eb">Remaining space</text><text x="830" y="490" font-size="17" font-weight="600" fill="#93c5fd">NTFS</text><text x="830" y="524" font-size="17" font-weight="600" fill="#cbd5e1">Drive: C:</text></g><rect x="425" y="630" width="550" height="52" rx="26" fill="#172554" stroke="#60a5fa"/><text x="700" y="663" font-family="Segoe UI,Arial" text-anchor="middle" font-size="20" font-weight="700" fill="#dbeafe">GPT + UEFI only • no BIOS/MBR path</text></svg>