name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Run syntax tests
        shell: pwsh
        run: ./tests/test_parse.ps1

  static-analysis:
    name: Static analysis
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run validate_script
        shell: pwsh
        run: ./scripts/validate_script.ps1

  pssa:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Settings ./PSScriptAnalyzerSettings.psd1

          if ($results) {
            $results | Format-Table -AutoSize
            $errors = @($results | Where-Object Severity -eq 'Error')
            if ($errors.Count -gt 0) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
              exit 1
            }
            Write-Host "PSScriptAnalyzer found $($results.Count) warning(s) - not failing the build."
          } else {
            Write-Host "PSScriptAnalyzer: clean."
          }

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: rhysd/actionlint@v1

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml '**/*.md'
          fail: true

  masterize:
    name: Masterize (doc + safety greps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Phase 1A — Doc consistency
        run: |
          set +e
          fail=0

          echo "=== 1. Version consistency ==="
          ver=$(grep -oP "ScriptVersion\s*=\s*'\K[0-9.]+" unified_winpe_deploy.ps1 | head -1)
          echo "Script version: $ver"
          if [ -z "$ver" ]; then echo "FAIL: could not extract version"; fail=1; fi
          for f in CHANGELOG.md CLAUDE.md README.md docs/KNOWN_ISSUES.md; do
            if grep -q "$ver" "$f"; then echo "OK: $f"; else echo "FAIL: $f missing $ver"; fail=1; fi
          done

          echo ""
          echo "=== 2. Cross-doc script coverage ==="
          for f in README.md docs/ARCHITECTURE.md CLAUDE.md docs/KNOWN_ISSUES.md; do
            for s in prepare_wim build_boot_wim unified_winpe_deploy; do
              if grep -q "$s" "$f"; then
                echo "OK: $f mentions $s"
              else
                echo "FAIL: $f missing $s"
                fail=1
              fi
            done
          done

          echo ""
          echo "=== 3. Stray E:\\images references ==="
          # Exclude MASTERIZE.md (it documents the pattern legitimately)
          stray=$(grep -rn 'E:\\images\|E:/images' docs/ scripts/ unified_winpe_deploy.ps1 2>/dev/null | grep -v 'docs/MASTERIZE.md:' || true)
          if [ -n "$stray" ]; then echo "FAIL:"; echo "$stray"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 4. Volume labels (must be IMAGES, WinPE, or Windows) ==="
          bad=$(grep -rn 'label=' docs/ scripts/ 2>/dev/null | grep -iv '"IMAGES"\|"WinPE"\|label=Windows' || true)
          if [ -n "$bad" ]; then echo "FAIL:"; echo "$bad"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 5. CHANGELOG link integrity ==="
          versions=$(grep '^## \[' CHANGELOG.md | grep -oP '\d+\.\d+\.\d+')
          for v in $versions; do
            if grep -q "\[$v\]:" CHANGELOG.md; then
              echo "OK: link for $v"
            else
              echo "FAIL: missing link for $v"
              fail=1
            fi
          done

          echo ""
          echo "=== 6. Three-programs diagram feature coverage ==="
          for keyword in 'driver' 'unattend' 'cctk'; do
            if [ "$keyword" = "driver" ]; then
              section='Prep time (admin Windows)'
            else
              section='Run time (inside WinPE)'
            fi
            if grep -A 15 "$section" docs/ARCHITECTURE.md | grep -qi "$keyword"; then
              echo "OK: '$keyword' in '$section'"
            else
              echo "FAIL: '$keyword' missing from '$section'"
              fail=1
            fi
          done

          echo ""
          echo "=== 7. README USB drive layout diagram coverage ==="
          for dir in 'images/' 'cctk/' 'configs/'; do
            if grep -A 16 '## USB Drive Layout' README.md | grep -q "$dir"; then
              echo "OK: '$dir' in USB layout"
            else
              echo "FAIL: '$dir' missing from USB Drive Layout diagram"
              fail=1
            fi
          done

          echo ""
          echo "=== 8. .EXAMPLE paths use I:\\images\\ ==="
          bad=$(grep -A 10 '\.EXAMPLE' unified_winpe_deploy.ps1 scripts/prepare_wim.ps1 scripts/build_boot_wim.ps1 | grep 'images\\' | grep -v 'I:\\images\\' || true)
          if [ -n "$bad" ]; then echo "FAIL:"; echo "$bad"; fail=1; else echo "OK"; fi

          exit $fail

      - name: Phase 1B — Code safety invariants
        run: |
          set +e
          fail=0
          script=unified_winpe_deploy.ps1

          echo "=== 9. -Force has explicit anti-bypass guard for system disk ==="
          if grep -q 'Force cannot bypass\|cannot bypass system' $script; then
            echo "OK"
          else
            echo "FAIL: -Force anti-bypass guard missing near DESTROY SYSTEM"
            fail=1
          fi

          echo ""
          echo "=== 10. mountvol /d guarded by \$env:SystemDrive ==="
          if grep -B 6 'mountvol.*\/d' $script | grep -q 'SystemDrive'; then
            echo "OK"
          else
            echo "FAIL: mountvol /d call lacks SystemDrive guard above it"
            fail=1
          fi

          echo ""
          echo "=== 11. No Stop-Computer (must use shutdown.exe in WinPE) ==="
          if grep -q 'Stop-Computer' $script; then
            echo "FAIL: Stop-Computer found — use shutdown.exe instead"
            fail=1
          else
            echo "OK"
          fi

          echo ""
          echo "=== 12. dism /Get-WimInfo invocations use /English ==="
          bad=$(grep -n 'dism\.exe.*Get-WimInfo\|& dism.*Get-WimInfo' $script | grep -v '/English' || true)
          if [ -z "$bad" ]; then
            echo "OK"
          else
            echo "FAIL: invocation missing /English:"
            echo "$bad"
            fail=1
          fi

          echo ""
          echo "=== 13. dism /apply-image uses /CheckIntegrity ==="
          ai=$(grep -n '/apply-image' $script | grep -v 'Write-Log\|Recovery\|manually\|Last resort\|#')
          if echo "$ai" | grep -q '/CheckIntegrity'; then
            echo "OK"
          else
            echo "FAIL: /apply-image invocation missing /CheckIntegrity"
            fail=1
          fi

          echo ""
          echo "=== 14. CCTK runs before disk selection ==="
          cctk=$(grep -n 'Invoke-CctkConfig' $script | grep -v 'function ' | head -1 | cut -d: -f1)
          disk=$(grep -n 'Select-TargetDisk -Disks' $script | head -1 | cut -d: -f1)
          if [ -n "$cctk" ] && [ -n "$disk" ] && [ "$cctk" -lt "$disk" ]; then
            echo "OK (cctk line $cctk < disk-select line $disk)"
          else
            echo "FAIL: CCTK ($cctk) not before disk selection ($disk)"
            fail=1
          fi

          echo ""
          echo "=== 15. Unattend copy ordered: verify < unattend < bcdboot ==="
          verify=$(grep -n 'verifyPaths' $script | head -1 | cut -d: -f1)
          panther=$(grep -n 'pantherDir.*Panther' $script | head -1 | cut -d: -f1)
          bcdboot=$(grep -n 'Set-BootConfiguration' $script | grep -v 'function ' | head -1 | cut -d: -f1)
          if [ -n "$verify" ] && [ -n "$panther" ] && [ -n "$bcdboot" ] \
             && [ "$verify" -lt "$panther" ] && [ "$panther" -lt "$bcdboot" ]; then
            echo "OK (verify $verify → unattend $panther → bcdboot $bcdboot)"
          else
            echo "FAIL: wrong order, got verify=$verify panther=$panther bcdboot=$bcdboot"
            fail=1
          fi

          exit $fail
