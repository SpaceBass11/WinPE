name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: PowerShell syntax
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show PowerShell version
        shell: pwsh
        run: $PSVersionTable

      - name: Run syntax tests
        shell: pwsh
        run: ./tests/test_parse.ps1

      - name: Run WIM index parser tests
        shell: pwsh
        run: ./tests/test_wim_parser.ps1

      - name: Run disk enumeration tests
        shell: pwsh
        run: ./tests/test_disk_enumeration.ps1

  pester:
    name: Pester validation-gate smoke tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Pester version
        shell: pwsh
        run: Get-Module -ListAvailable Pester | Select-Object Name, Version | Format-Table

      - name: Run Pester tests
        shell: pwsh
        run: |
          # Force Pester v5+ (windows-latest ships v3 alongside v5; we need v5).
          $pester = Get-Module -ListAvailable Pester |
            Where-Object { $_.Version.Major -ge 5 } |
            Sort-Object Version -Descending |
            Select-Object -First 1
          if (-not $pester) {
            Write-Host "Installing Pester v5..."
            Install-Module Pester -MinimumVersion 5.0.0 -Force -Scope CurrentUser -SkipPublisherCheck
            $pester = Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 } | Select-Object -First 1
          }
          Import-Module $pester.Path -Force

          $config = New-PesterConfiguration
          $config.Run.Path        = './tests/validation-gates.Tests.ps1'
          $config.Run.Exit        = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'pester-results.xml'
          Invoke-Pester -Configuration $config

      - name: Upload Pester results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: pester-results.xml

  pssa:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          $results = Invoke-ScriptAnalyzer `
            -Path . `
            -Recurse `
            -Settings ./PSScriptAnalyzerSettings.psd1

          if ($results) {
            $results | Format-Table -AutoSize
            $errors = @($results | Where-Object Severity -eq 'Error')
            if ($errors.Count -gt 0) {
              Write-Error "PSScriptAnalyzer found $($errors.Count) error(s)."
              exit 1
            }
            Write-Host "PSScriptAnalyzer found $($results.Count) warning(s) - not failing the build."
          } else {
            Write-Host "PSScriptAnalyzer: clean."
          }

  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: true

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml '**/*.md'
          fail: true

  masterize:
    name: Masterize (doc + safety greps)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Phase 1A — Doc consistency
        run: |
          set +e
          fail=0

          echo "=== 1. Version consistency ==="
          ver=$(grep -oP "ScriptVersion\s*=\s*'\K[0-9.]+" unified_winpe_deploy.ps1 | head -1)
          echo "Script version: $ver"
          if [ -z "$ver" ]; then echo "FAIL: could not extract version"; fail=1; fi
          for f in CHANGELOG.md CLAUDE.md README.md; do
            if grep -q "$ver" "$f"; then echo "OK: $f"; else echo "FAIL: $f missing $ver"; fail=1; fi
          done

          echo ""
          echo "=== 2. Cross-doc script coverage ==="
          for f in README.md docs/ARCHITECTURE.md CLAUDE.md; do
            for s in prepare_wim build_boot_wim unified_winpe_deploy; do
              if grep -q "$s" "$f"; then
                echo "OK: $f mentions $s"
              else
                echo "FAIL: $f missing $s"
                fail=1
              fi
            done
          done

          echo ""
          echo "=== 3. Stray E:\\images references ==="
          # Exclude MASTERIZE.md (it documents the pattern legitimately)
          stray=$(grep -rn 'E:\\images\|E:/images' docs/ scripts/ unified_winpe_deploy.ps1 .claude/MASTERIZE.md 2>/dev/null | grep -v 'MASTERIZE.md:' || true)
          if [ -n "$stray" ]; then echo "FAIL:"; echo "$stray"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 4. Volume labels (must be IMAGES, WinPE, or Windows) ==="
          bad=$(grep -rn 'label=' docs/ scripts/ 2>/dev/null | grep -iv '"IMAGES"\|"WinPE"\|label=Windows' || true)
          if [ -n "$bad" ]; then echo "FAIL:"; echo "$bad"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 5. Three-programs diagram feature coverage ==="
          for keyword in 'driver' 'unattend' 'cctk'; do
            if [ "$keyword" = "driver" ]; then
              section='Prep time (admin Windows)'
            else
              section='Run time (inside WinPE)'
            fi
            if grep -A 15 "$section" docs/ARCHITECTURE.md | grep -qi "$keyword"; then
              echo "OK: '$keyword' in '$section'"
            else
              echo "FAIL: '$keyword' missing from '$section'"
              fail=1
            fi
          done

          echo ""
          echo "=== 6. README USB drive layout diagram coverage ==="
          for dir in 'images/' 'cctk/' 'configs/'; do
            if grep -A 16 '## USB Drive Layout' README.md | grep -q "$dir"; then
              echo "OK: '$dir' in USB layout"
            else
              echo "FAIL: '$dir' missing from USB Drive Layout diagram"
              fail=1
            fi
          done

          echo ""
          echo "=== 7. .EXAMPLE paths use I:\\images\\ ==="
          bad=$(grep -A 10 '\.EXAMPLE' unified_winpe_deploy.ps1 scripts/prepare_wim.ps1 scripts/build_boot_wim.ps1 | grep 'images\\' | grep -v 'I:\\images\\' || true)
          if [ -n "$bad" ]; then echo "FAIL:"; echo "$bad"; fail=1; else echo "OK"; fi

          exit $fail

      - name: Phase 1B — Code safety invariants
        run: |
          set +e
          fail=0
          script=unified_winpe_deploy.ps1

          echo "=== 8. -Force has explicit anti-bypass guard for system disk ==="
          if grep -q 'Force cannot bypass\|cannot bypass system' $script; then
            echo "OK"
          else
            echo "FAIL: -Force anti-bypass guard missing near DESTROY SYSTEM"
            fail=1
          fi

          echo ""
          echo "=== 9. mountvol /d guarded by \$env:SystemDrive ==="
          # Window widened from 6 to 14 lines in v4.7.0 to accommodate the
          # sibling -ProtectedSourceDrive guard that sits between the
          # SystemDrive check and the mountvol /d call. Both guards must
          # stay above the call.
          if grep -B 14 'mountvol.*\/d' $script | grep -q 'SystemDrive'; then
            echo "OK"
          else
            echo "FAIL: mountvol /d call lacks SystemDrive guard above it"
            fail=1
          fi

          echo ""
          echo "=== 10. No Stop-Computer (must use shutdown.exe in WinPE) ==="
          if grep -q 'Stop-Computer' $script; then
            echo "FAIL: Stop-Computer found — use shutdown.exe instead"
            fail=1
          else
            echo "OK"
          fi

          echo ""
          echo "=== 11. dism /Get-WimInfo invocations use /English ==="
          bad=$(grep -n 'dism\.exe.*Get-WimInfo\|& dism.*Get-WimInfo' $script | grep -v '/English' || true)
          if [ -z "$bad" ]; then
            echo "OK"
          else
            echo "FAIL: invocation missing /English:"
            echo "$bad"
            fail=1
          fi

          echo ""
          echo "=== 12. dism /apply-image uses /CheckIntegrity ==="
          ai=$(grep -n '/apply-image' $script | grep -v 'Write-Log\|Recovery\|manually\|Last resort\|#')
          if echo "$ai" | grep -q '/CheckIntegrity'; then
            echo "OK"
          else
            echo "FAIL: /apply-image invocation missing /CheckIntegrity"
            fail=1
          fi

          echo ""
          echo "=== 13. CCTK runs before disk selection ==="
          cctk=$(grep -n 'Invoke-CctkConfig' $script | grep -v 'function ' | head -1 | cut -d: -f1)
          disk=$(grep -n 'Select-TargetDisk -Disks' $script | head -1 | cut -d: -f1)
          if [ -n "$cctk" ] && [ -n "$disk" ] && [ "$cctk" -lt "$disk" ]; then
            echo "OK (cctk line $cctk < disk-select line $disk)"
          else
            echo "FAIL: CCTK ($cctk) not before disk selection ($disk)"
            fail=1
          fi

          echo ""
          echo "=== 14. Unattend copy ordered: verify < unattend < bcdboot ==="
          verify=$(grep -n 'verifyPaths' $script | head -1 | cut -d: -f1)
          panther=$(grep -n 'pantherDir.*Panther' $script | head -1 | cut -d: -f1)
          bcdboot=$(grep -n 'Set-BootConfiguration' $script | grep -v 'function ' | head -1 | cut -d: -f1)
          if [ -n "$verify" ] && [ -n "$panther" ] && [ -n "$bcdboot" ] \
             && [ "$verify" -lt "$panther" ] && [ "$panther" -lt "$bcdboot" ]; then
            echo "OK (verify $verify → unattend $panther → bcdboot $bcdboot)"
          else
            echo "FAIL: wrong order, got verify=$verify panther=$panther bcdboot=$bcdboot"
            fail=1
          fi

          echo ""
          echo "=== 15. Diskpart GPT layout (EFI 300MB + MSR 16MB + NTFS Windows) ==="
          ok=1
          grep -q 'create partition efi size=300' $script || { echo "  missing: 'create partition efi size=300'"; ok=0; }
          grep -q 'create partition msr size=16'  $script || { echo "  missing: 'create partition msr size=16'";  ok=0; }
          grep -q 'format quick fs=ntfs label=Windows' $script || { echo "  missing: 'format quick fs=ntfs label=Windows'"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: diskpart layout drifted"; fail=1; fi

          echo ""
          echo "=== 16. Diskpart drive letters (S: for EFI, C: for primary) ==="
          if grep -q 'assign letter S' $script && grep -q 'assign letter C' $script; then
            echo "OK"
          else
            echo "FAIL: missing 'assign letter S' or 'assign letter C'"
            fail=1
          fi

          echo ""
          echo "=== 17. BCDBoot UEFI configuration (bcdboot ... /s S: ... /f UEFI) ==="
          if grep -q 'bcdboot' $script && grep -qE '/s[[:space:]]+S:' $script && grep -qE '/f[[:space:]]+UEFI' $script; then
            echo "OK"
          else
            echo "FAIL: bcdboot not configured for UEFI / S: target"
            fail=1
          fi

          echo ""
          echo "=== 18. Exit codes checked after destructive steps ==="
          ok=1
          for fn in 'Invoke-Diskpart' 'Apply-WindowsImage' 'Set-BootConfiguration'; do
            grep -q "$fn" $script || { echo "  missing function: $fn"; ok=0; }
          done
          grep -q 'ExitCode' $script || { echo "  no ExitCode handling found anywhere"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: exit-code chain broken"; fail=1; fi

          echo ""
          echo "=== 19. Safety confirmation strings present (DELETE ALL DATA, DESTROY SYSTEM) ==="
          ok=1
          for s in 'DELETE ALL DATA' 'DESTROY SYSTEM'; do
            grep -qF "$s" $script || { echo "  missing: '$s'"; ok=0; }
          done
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: confirmation strings drifted"; fail=1; fi

          echo ""
          echo "=== 20. BitLocker / data-disk defaults stay opt-in ==="
          # If either default flips on, the entire fleet is exposed. The
          # v4.6.x regression had DataDiskNumber=1 and BitLockerPin a
          # plaintext placeholder; both must stay off in the Config block.
          ok=1
          grep -qE 'DataDiskNumber\s*=\s*-1'   $script || { echo "  DataDiskNumber default is not -1"; ok=0; }
          grep -qE 'EnableBitLocker\s*=\s*\$false' $script || { echo "  EnableBitLocker default is not \$false"; ok=0; }
          grep -qE 'BitLockerPin\s*=\s*\$null' $script || { echo "  BitLockerPin default is not \$null"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: BitLocker / data-disk defaults drifted on"; fail=1; fi

          echo ""
          echo "=== 22. WIPE DATA typed confirmation present, gated by -Force only ==="
          # The data-disk format MUST go through a typed prompt; -Force may
          # skip it (matches the WIPE ALL / ERASE pattern) but -Silent
          # alone must not.
          ok=1
          grep -qF "Type 'WIPE DATA'"        $script || { echo "  missing 'WIPE DATA' typed prompt"; ok=0; }
          grep -qF "'WIPE DATA' prompt cannot run silently" $script || { echo "  silent mode does not refuse data-disk without -Force"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: WIPE DATA gate weakened"; fail=1; fi

          echo ""
          echo "=== 23. BitLocker recovery keys do NOT default to the encrypted volume ==="
          # The v4.6.x bug stored C:'s recovery key on D:, which only
          # auto-unlocks when C: is healthy - exactly the failure mode
          # recovery keys exist for. The new code escrows to the IMAGES
          # partition (DEPLOY_IMAGE_DRIVE) or a -BitLockerKeyPath override.
          if grep -qE "'D:\\\\BitLocker'" $script; then
            echo "FAIL: hardcoded 'D:\\BitLocker' escrow path present (regression to v4.6.x design)"
            fail=1
          else
            echo "OK"
          fi

          echo ""
          echo "=== 24. build_boot_wim.ps1 startnet.cmd reads deploy.args from IMAGES ==="
          # The per-USB deploy.args mechanism: operator can retarget a USB
          # without rebuilding boot.wim. A refactor that removes the
          # startnet.cmd lookup would silently regress every operator's
          # config without surfacing a build-time error.
          builder=scripts/build_boot_wim.ps1
          ok=1
          grep -qF 'deploy.args' $builder || { echo "  startnet.cmd no longer references deploy.args"; ok=0; }
          grep -qF 'set /p DEPLOYARGS' $builder || { echo "  startnet.cmd no longer reads deploy.args via set /p"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: deploy.args wiring drifted"; fail=1; fi

          echo "=== 25. build_boot_wim.ps1 startnet.cmd does not echo raw deploy.args ==="
          # A BitLocker PIN or other secret embedded in deploy.args must not
          # appear on the WinPE console at boot (KVM, screencast, over-the-
          # shoulder). startnet.cmd should confirm the load without printing
          # the value. Regressing to "echo !DEPLOYARGS!" would silently
          # restore the leak.
          builder=scripts/build_boot_wim.ps1
          if grep -qE '^\s*echo\s+!DEPLOYARGS!' $builder; then
            echo "FAIL: startnet.cmd echoes raw !DEPLOYARGS! - PIN leak risk"
            fail=1
          else
            echo "OK"
          fi

          echo "=== 26. BitLocker PIN prompt exists and is silent-gated ==="
          # The TUI PIN prompt (-EnableBitLocker without -BitLockerPin in
          # non-silent mode) must be guarded by '-not $Silent' so silent /
          # unattended deploys never block on a hidden Read-Host. A regression
          # that drops the Silent guard would deadlock every air-gapped
          # operator USB that omitted the PIN by mistake.
          ok=1
          grep -qF "prompting at WinPE console" $script || { echo "  TUI PIN prompt log line missing"; ok=0; }
          grep -qF "Read-Host -Prompt 'Enter BitLocker startup PIN" $script || { echo "  Read-Host PIN prompt missing"; ok=0; }
          # The Read-Host must be guarded by -not $Silent on a nearby preceding
          # line. Use grep -- to stop flag parsing since the pattern starts
          # with a dash.
          if ! grep -B 3 "Read-Host -Prompt 'Enter BitLocker startup PIN" $script | grep -qF -- '-not $Silent'; then
            echo "  PIN prompt is not gated by -not \$Silent (would deadlock unattended deploys)"
            ok=0
          fi
          if [ "$ok" -eq 1 ]; then echo "OK"; else echo "FAIL: BitLocker TUI PIN prompt drifted"; fail=1; fi

          echo "=== 27. build_boot_wim.ps1 startnet.cmd substitutes {DRIVE} placeholder ==="
          # build_iso.ps1 emits deploy.args with paths like "{DRIVE}\images\..."
          # so the same ISO works regardless of which letter WinPE assigns
          # the USB at boot. startnet.cmd substitutes the placeholder with
          # %DEPLOY_IMAGE_DRIVE% before launching the deploy script. A
          # refactor that drops the substitution would silently break every
          # ISO built by build_iso.ps1 - PowerShell would receive the
          # literal "{DRIVE}\images\..." and fail to find the image.
          builder=scripts/build_boot_wim.ps1
          if grep -qE 'DEPLOYARGS:\{DRIVE\}=%DEPLOY_IMAGE_DRIVE%' $builder; then
            echo "OK"
          else
            echo "FAIL: startnet.cmd no longer substitutes {DRIVE} - build_iso.ps1 ISOs will fail at runtime"
            fail=1
          fi

          exit $fail
