name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          reporter: github-check
          fail_on_error: true

  link-check:
    name: Markdown link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml '**/*.md'
          fail: true

  masterize:
    name: Masterize (doc consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Phase 1A -- Doc consistency
        run: |
          set +e
          fail=0

          echo "=== 3. Stray E:\\images references ==="
          stray=$(grep -rn 'E:\\images\|E:/images' docs/ .claude/MASTERIZE.md 2>/dev/null | grep -v 'MASTERIZE.md:' || true)
          if [ -n "$stray" ]; then echo "FAIL:"; echo "$stray"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 4. Volume labels (must be IMAGES, WinPE, or Windows) ==="
          bad=$(grep -rn 'label=' docs/ 2>/dev/null | grep -iv '"IMAGES"\|"WinPE"\|label=Windows' || true)
          if [ -n "$bad" ]; then echo "FAIL:"; echo "$bad"; fail=1; else echo "OK"; fi

          echo ""
          echo "=== 5. Architecture doc coverage ==="
          for keyword in 'driver' 'unattend' 'cctk'; do
            if [ "$keyword" = "driver" ]; then
              section='Prep time (admin Windows)'
            else
              section='Run time (inside WinPE)'
            fi
            if grep -A 15 "$section" docs/ARCHITECTURE.md | grep -qi "$keyword"; then
              echo "OK: '$keyword' in '$section'"
            else
              echo "FAIL: '$keyword' missing from '$section'"
              fail=1
            fi
          done

          exit $fail
