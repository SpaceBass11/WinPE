name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v4.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract changelog section
        id: changelog
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          VERSION="${TAG#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]"      { flag=1; print; next }
            flag && $0 ~ "^## \\["        { exit }
            flag                          { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "No changelog entry found for $VERSION — using tag message" >&2
            git tag -l --format='%(contents)' "$TAG" > release_notes.md
          fi

          echo "--- release notes ---"
          cat release_notes.md

      - name: Stage release artifacts
        run: |
          mkdir -p dist
          cp unified_winpe_deploy.ps1 dist/
          cp scripts/build_boot_wim.ps1 dist/
          cp LICENSE dist/
          cp README.md dist/
          (cd dist && sha256sum unified_winpe_deploy.ps1 build_boot_wim.ps1 > SHA256SUMS)

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.name, '-') }}
          files: |
            dist/unified_winpe_deploy.ps1
            dist/build_boot_wim.ps1
            dist/SHA256SUMS
