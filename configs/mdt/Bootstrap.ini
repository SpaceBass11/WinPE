; =============================================================================
; Bootstrap.ini — baked into the WinPE image inside the payload ISO.
;
; For standalone USB media, the only thing that matters here is:
;
;   DeployRoot=.
;
; That single dot tells LiteTouch "the deployment share is on the same
; media I booted from." No network, no server, no credentials required.
;
; Everything else (task sequence selection, disk targeting, locale) lives
; in CustomSettings.ini which is also baked into the media.
;
; After editing either file, rebuild the ISO:
;   .\scripts\mdt\New-MDTMedia.ps1
; =============================================================================

[Settings]
Priority=Default

[Default]
; Read the deployment content from the booted USB/media — no network needed
DeployRoot=.

; Skip the LiteTouch welcome / language screen
SkipBDDWelcome=YES

KeyboardLocale=en-US
