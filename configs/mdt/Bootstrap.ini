; =============================================================================
; Bootstrap.ini -- baked into the WinPE image inside the payload ISO.
;
; Paste this into Deployment Workbench:
;   Right-click deployment share > Properties > Rules tab > Edit Bootstrap.ini
;   Also paste into MEDIA001 > Properties > Rules tab > Edit Bootstrap.ini
;
; DeployRoot=. tells LiteTouch "the deployment share is on the same media
; I booted from." No network, no server, no credentials required.
;
; After editing either INI file, right-click the deployment share >
; Update Deployment Share, then right-click MEDIA001 > Update Media Content.
; =============================================================================

[Settings]
Priority=Default

[Default]
; Read the deployment content from the booted USB -- no network needed
DeployRoot=.

; Skip the LiteTouch welcome / language selection screen
SkipBDDWelcome=YES
