; =============================================================================
; CustomSettings.ini -- zero-touch standalone USB deployment
;
; Paste this into Deployment Workbench:
;   Right-click deployment share > Properties > Rules tab (large text area)
;   Also paste into MEDIA001 > Properties > Rules tab
;
; Goal: operator plugs in USB, boots laptop, walks away.
; No menus. No prompts. No decisions.
; =============================================================================

[Settings]
Priority=Default

[Default]
_SMSTSOrgName=Windows 11 Deployment
OSInstall=Y
HideShell=YES

; ---- Zero-touch: skip all wizard pages --------------------------------
SkipAdminPassword=YES
SkipApplications=YES
SkipBitLocker=YES
SkipCapture=YES
SkipComputerBackup=YES
SkipComputerName=YES
SkipDomainMembership=YES
SkipFinalSummary=YES
SkipLocaleSelection=YES
SkipPackageDisplay=YES
SkipProductKey=YES
SkipSummary=YES
SkipTaskSequence=YES
SkipTimeZone=YES
SkipUserData=YES
SkipWizard=YES

; ---- Task sequence and locale ----------------------------------------
; TaskSequenceID must match the ID you set in Workbench (step 4 in docs/MDT.md)
TaskSequenceID=WIN11-DEPLOY
TimeZone=020
TimeZoneName=Central Standard Time
KeyboardLocale=0409:00000409

; ---- Domain vs. workgroup --------------------------------------------
; To join a domain, replace JoinWorkgroup with:
;   JoinDomain=yourdomain.local
;   DomainAdmin=svc_mdt
;   DomainAdminPassword=<password>
;   DomainAdminDomain=yourdomain.local
;   MachineObjectOU=OU=Workstations,DC=yourdomain,DC=local
JoinWorkgroup=WORKGROUP

; ---- Computer naming -------------------------------------------------
; Uncomment one pattern, or leave both commented (keeps existing name).
;OSDComputerName=PC-%SerialNumber%
;OSDComputerName=WS-%AssetTag%

; ---- BitLocker PIN ---------------------------------------------------
; Read by the Enable BitLocker task sequence step (TPM and PIN mode).
; Numeric, 6+ digits recommended. Stored plaintext in the ISO -- treat
; the ISO like a credential and rotate the PIN post-deploy.
BDEPin=

; ---- No capture, no user data migration ------------------------------
DoCapture=NO
ComputerBackupLocation=NONE
UserDataLocation=NONE

; ---- Post-deploy action ----------------------------------------------
; Restart: reboots into Windows (operators confirm it's working)
; Shutdown: powers off (pull USB, hand to user)
FinishAction=Restart
