; =============================================================================
; CustomSettings.ini — zero-touch standalone USB deployment
;
; This file is baked into the payload ISO by New-MDTMedia.ps1.
; Change it here, rebuild the ISO, upload the new file. Done.
;
; Goal: operator plugs in USB, boots laptop, walks away.
; No menus. No prompts. No decisions.
; =============================================================================

[Settings]
Priority=Default
Properties=

[Default]
OSInstall=Y

; ----- Task sequence -----
; Must match the ID created by Initialize-MDTDeploymentShare.ps1.
; Format: DEPLOY-<OSNAME> e.g. DEPLOY-WIN11-PRO, DEPLOY-WIN10-LTSC-2021
TaskSequenceID=DEPLOY-WIN11-PRO

; ----- Suppress all wizard pages -----
SkipBDDWelcome=YES
SkipTaskSequence=YES
SkipComputerName=YES
SkipUserData=YES
SkipLocaleSelection=YES
SkipTimeZone=YES
SkipApplications=YES
SkipPackageDisplay=YES
SkipRoles=YES
SkipBitLocker=YES
SkipSummary=YES
SkipFinalSummary=YES

; ----- Disk -----
; Targets disk 0 (the first physical disk — usually the internal SSD/HDD).
; Increase if your target hardware has an NVMe at disk 1, etc.
; Verify with: diskpart > list disk   (before committing to a value)
OSDDiskIndex=0

; ----- Locale / time zone -----
KeyboardLocale=en-US
UserLocale=en-US
SystemLocale=en-US
TimeZoneName=Central Standard Time

; ----- Computer naming -----
; Leave blank = Windows generates a random name (WIN-XXXXXX).
; %SerialNumber% = use the machine's service tag / serial number.
; Fixed string   = same name on every machine (fine for test builds).
OSDComputerName=

; ----- Admin password -----
; Set this to the local Administrator password you want on the imaged machine.
; Leave blank = Administrator account is disabled (Windows default behavior).
AdminPassword=

; ----- Post-deploy -----
; REBOOT   = reboot immediately (remove the USB before next POST)
; SHUTDOWN = power off (safe to leave USB in, operator removes it manually)
FinishAction=REBOOT
