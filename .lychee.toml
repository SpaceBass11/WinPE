# Lychee link-checker configuration
# Used by the `link-check` job in .github/workflows/ci.yml

# Skip anchors — GitHub renders Markdown headings into anchors but
# lychee would have to fetch the full rendered HTML to verify them.
include_fragments = false

# Treat GitHub rate-limit responses (429) as success rather than error.
# Note: `accept` replaces the default 200-299 success range, so it must
# be re-listed explicitly here.
accept = ["200..=299", "429"]

# Skip URLs that 404 by design until something happens on GitHub:
#   - actions/: CI badge URL — 404s until the first workflow run
#     completes, and on PRs from forks it 404s for the fork's badge path.
#   - releases/tag/ and compare/: CHANGELOG footer links follow the
#     Keep-a-Changelog convention but no release tags have been
#     published yet. Remove these excludes once you start tagging.
exclude = [
  "https://github.com/spacebass11/WinPE/actions",
  "https://github.com/spacebass11/WinPE/releases/tag/",
  "https://github.com/spacebass11/WinPE/compare/",
]
