# Lychee link-checker configuration
# Used by the `link-check` job in .github/workflows/ci.yml

# Anchors/fragments are NOT checked. That is lychee's default, so there is
# deliberately no key here: `include_fragments` is the opt-in CLI flag
# (--include-fragments) and lychee >= 0.24 rejects it as a config-file key
# with "TOML parse error ... wanted string or table", which fails the
# link-check job at config-load time before a single link is examined.
# Leave this as a comment; do not re-add the key.

# Treat GitHub rate-limit responses (429) as success rather than error.
# Note: `accept` replaces the default 200-299 success range, so it must
# be re-listed explicitly here.
accept = ["200..=299", "429"]

# Skip the CI badge URL — 404s until the first workflow run completes,
# and on PRs from forks it returns 404 for the fork's badge path.
exclude = [
  "https://github.com/spacebass11/WinPE/actions",
  "https://claude.ai",
]
